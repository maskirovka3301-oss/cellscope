name: CMake multi-platform

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake sdl3 freetype curl libsodium

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfreetype-dev libcurl4-openssl-dev libsodium-dev libvulkan-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdecor-0-dev libpipewire-0.3-dev libv4l-dev

      - name: Build SDL3 on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/SDL3.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.0/SDL3-3.4.0.tar.gz
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          cmake -S /tmp/SDL3-3.4.0 -B /tmp/sdl3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build /tmp/sdl3-build --parallel
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig
          find /usr/local -name SDL3Config.cmake -print
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig \
            pkg-config --modversion sdl3

      - name: Configure (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra+=("-DCMAKE_PREFIX_PATH=$(brew --prefix)")
          else
            extra+=("-DCMAKE_PREFIX_PATH=/usr/local")
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCELLSCOPE_BUILD_TESTS=ON \
            "${extra[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCELLSCOPE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/cellscope.app dist/CellScope-macos-arm64.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/CellScope-linux-x86_64.tar.gz \
            -C build cellscope assets scripts third_party

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/Release/*" -DestinationPath "dist/CellScope-windows-x64.zip"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: cellscope-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release commit with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            branch="${GITHUB_REF#refs/heads/release/}"
            if [[ "$branch" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tag="v${branch#v}"
            else
              echo "Release branches must be named release/x.y.z or release/vx.y.z" >&2
              exit 1
            fi
          else
            tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          fi
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Publishing/refreshing $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No semantic version tag on this main commit; build only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose release notes
        if: steps.release_tag.outputs.tag != ''
        run: |
          {
            printf '**Production ready.**\n\n'
            printf 'Automated multi-platform production build of CellScope.\n\n'
            printf 'Built at %s from %s for:\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA}"
            printf -- '- Mac OS (Apple silicon)\n'
            printf -- '- Linux x86_64\n'
            printf -- '- Windows x86_64\n'
          } > release-notes.md

      - name: Create or refresh GitHub release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CellScope ${{ steps.release_tag.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: false
